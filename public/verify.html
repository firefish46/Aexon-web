<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Product Verified | Aexon Healthcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF5A00;
    --orange-soft: #FFB000;
    --blue: #3A9BFF;
    --cyan: #5BE7FF;
    --green: #5CE600;
    --navy: #0B1A3A;
    --ink: #111315;
    --muted: #5F6672;
    --line: #E7EAF0;
    --bg: #F6F8FB;
    --card: #FFFFFF;
    --success: #16A34A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- Background ---------- */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0;
    z-index: 0;
    animation: blobIn 1.6s ease forwards, drift 14s ease-in-out infinite alternate;
  }
  .bg-blob.b1 { width: 380px; height: 380px; background: var(--cyan);   top: -120px; left: -100px; }
  .bg-blob.b2 { width: 320px; height: 320px; background: var(--orange); bottom: -120px; right: -80px; animation-delay: .2s, 0s; }
  .bg-blob.b3 { width: 240px; height: 240px; background: var(--green);  top: 40%; right: 10%; animation-delay: .4s, 0s; }

  @keyframes blobIn { to { opacity: .22; } }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(30px, -20px) scale(1.1); }
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 24px 60px -20px rgba(11, 26, 58, .25), 0 2px 6px rgba(11, 26, 58, .05);
    padding: 32px 28px 24px;
    text-align: center;
    overflow: hidden;
    opacity: 0;
    transform: translateY(30px) scale(.97);
    animation: cardIn .7s cubic-bezier(.2, .8, .2, 1) .1s forwards;
  }
  @keyframes cardIn { to { opacity: 1; transform: none; } }

  /* Brand gradient strip at top of card */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--cyan), var(--blue), var(--green), var(--orange-soft), var(--orange));
    transform-origin: left;
    transform: scaleX(0);
    animation: stripIn 1s ease .5s forwards;
  }
  @keyframes stripIn { to { transform: scaleX(1); } }

  .logo {
    width: 190px;
    max-width: 70%;
    height: auto;
    display: block;
    margin: 0 auto 26px;
    opacity: 0;
    animation: fadeDown .7s ease .35s forwards;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Verify badge ---------- */
  .badge-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 22px;
  }

  /* Scanning phase: spinning gradient ring */
  .scan-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 55%, var(--blue) 75%, var(--green) 90%, var(--orange) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    animation: spin .9s linear infinite;
    transition: opacity .4s ease;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pulsing halo behind check */
  .halo {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(22, 163, 74, .18);
    opacity: 0;
  }

  .check-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .check-svg .circle {
    fill: none;
    stroke: var(--success);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 360;
    stroke-dashoffset: 360;
    transform: rotate(-90deg);
    transform-origin: center;
  }
  .check-svg .fill {
    fill: var(--success);
    transform-origin: center;
    transform: scale(0);
  }
  .check-svg .tick {
    fill: none;
    stroke: #fff;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 80;
    stroke-dashoffset: 80;
  }

  /* Verified state (toggled by JS after scan) */
  .verified .scan-ring { opacity: 0; }
  .verified .check-svg .circle { animation: draw .6s ease forwards; }
  .verified .check-svg .fill   { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) .5s forwards; }
  .verified .check-svg .tick   { animation: draw .4s ease .85s forwards; }
  .verified .halo              { animation: halo 2.2s ease-out 1s infinite; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop  { to { transform: scale(1); } }
  @keyframes halo {
    0%   { opacity: .9; transform: scale(1); }
    100% { opacity: 0;  transform: scale(1.6); }
  }

  /* ---------- Text ---------- */
  .status-text {
    min-height: 92px;
  }
  .checking {
    font-size: 15px;
    color: var(--muted);
    font-weight: 500;
    transition: opacity .3s ease;
  }
  .checking .dots::after {
    content: "";
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots {
    0%  { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }

  .title, .subtitle, .details, .footer { opacity: 0; }

  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -.3px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .title span { color: var(--success); }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 320px;
    margin: 0 auto;
  }

  .verified .checking { display: none; }
  .verified .title    { animation: rise .6s ease 1.1s forwards; }
  .verified .subtitle { animation: rise .6s ease 1.25s forwards; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Details ---------- */
  .details {
    margin-top: 24px;
    border: 1px solid var(--line);
    border-radius: 16px;
    text-align: left;
    overflow: hidden;
  }
  .verified .details { animation: rise .6s ease 1.45s forwards; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    font-size: 13.5px;
    opacity: 0;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { color: var(--muted); flex-shrink: 0; }
  .row .value { font-weight: 600; text-align: right; word-break: break-word; }

  .verified .row { animation: slideIn .45s ease forwards; }
  .verified .row:nth-child(1) { animation-delay: 1.6s; }
  .verified .row:nth-child(2) { animation-delay: 1.7s; }
  .verified .row:nth-child(3) { animation-delay: 1.8s; }
  .verified .row:nth-child(4) { animation-delay: 1.9s; }
  .verified .row:nth-child(5) { animation-delay: 2.0s; }
  .verified .row:nth-child(6) { animation-delay: 2.1s; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: none; }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(22, 163, 74, .1);
    color: var(--success);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
  }

  .footer {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .footer strong { color: var(--orange); font-weight: 600; }
  .verified .footer { animation: rise .6s ease 2.3s forwards; }

  /* ---------- Confetti ---------- */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }
  .confetti i {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { opacity: 0; transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 380px) {
    .card { padding: 28px 18px 20px; }
    .title { font-size: 24px; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .confetti { display: none; }
  }
</style>
</head>

    // Hide rows that have no value so the card stays clean
    document.querySelectorAll(".row").forEach(function (row) {
      var v = row.querySelector("[data-field]");
      if (v && v.textContent === "—") row.style.display = "none";
    });

    document.getElementById("verifiedAt").textContent = new Date().toLocaleString("en-GB", {
      day: "2-digit", month: "short", year: "numeric",
      hour: "2-digit", minute: "2-digit"
    });

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var scanTime = reduceMotion ? 0 : 1600;

    setTimeout(function () {
      document.getElementById("card").classList.add("verified");
      if (!reduceMotion) setTimeout(launchConfetti, 900);
      if (navigator.vibrate) navigator.vibrate(60);
    }, scanTime);

    function launchConfetti() {
      var colors = ["#5BE7FF", "#3A9BFF", "#5CE600", "#FFB000", "#FF5A00", "#16A34A"];
      var box = document.getElementById("confetti");
      var count = window.innerWidth < 500 ? 70 : 120;

      for (var i = 0; i < count; i++) {
        var p = document.createElement("i");
        var size = 6 + Math.random() * 6;
        p.style.left = Math.random() * 100 + "vw";
        p.style.width = size + "px";
        p.style.height = size * (Math.random() > 0.5 ? 1.8 : 1) + "px";
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.borderRadius = Math.random() > 0.7 ? "50%" : "2px";
        p.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
        p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
        p.style.animationDuration = (2.4 + Math.random() * 2) + "s";
        p.style.animationDelay = (Math.random() * 0.6) + "s";
        box.appendChild(p);
      }
      setTimeout(function () { box.innerHTML = ""; }, 5500);
    }
  })();
</script>
</body>
</html>
