# Apache include for cPanel / WHM: sends aexon.uk traffic to the Next.js app.
#
# cPanel rebuilds its Apache config, so never edit httpd.conf directly.
# Install this file in BOTH of these folders (as root), replacing CPANELUSER:
#
#   /etc/apache2/conf.d/userdata/ssl/2_4/CPANELUSER/aexon.uk/aexon-proxy.conf
#   /etc/apache2/conf.d/userdata/std/2_4/CPANELUSER/aexon.uk/aexon-proxy.conf
#
# then run:
#   /scripts/ensure_vhost_includes --user=CPANELUSER
#   /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
#
# The aexon.uk virtual host already answers for www.aexon.uk as well.
# 3100 must match the port in ecosystem.config.cjs.

<IfModule proxy_module>
    ProxyPreserveHost On
    ProxyRequests Off

    # Keep cPanel's AutoSSL checks working: these files are served by Apache
    # from public_html, not by the app.
    ProxyPass /.well-known/ !

    ProxyPass        / http://127.0.0.1:3100/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3100/
</IfModule>

<IfModule headers_module>
    # Tells the app the visitor came in over HTTPS (Cloudflare and the ssl vhost
    # always do). Harmless in the std (port 80) vhost.
    RequestHeader set X-Forwarded-Proto "https"
</IfModule>
